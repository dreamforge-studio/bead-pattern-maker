/* 每关使用的颜色种数：需要清空爆炸的关卡颜色少、单色总量足，

if (typeof module !== 'undefined' && module.exports) {

<script>
'use strict';
/* ================= 常量（机制参数与原版一致，参数同源 levels.js） ================= */
var W = 375, H = 667, HUD_H = 64, BAR_H = 76, FIELD_Y = 64, FIELD_H = 527;
var BLAST_NEED = 8, BLAST_RADIUS = 115, CRACK_RANGE = 26, RED_TTL = 5, SCREEN_TARGET = 12;
var COLORS = COLOR_VALUES;
/* 快乐版显示色板（多巴胺高饱和，2026-11-17 改版；仅显示层，levels.js 的 COLOR_VALUES 不动） */
var JOY_COLORS = ['#ff3d8a', '#00a8ff', '#ffb300', '#84e01e', '#a259ff'];
var CORAL = '#ff4d5e';                 // 倒计时泡：亮珊瑚红
var INK = '#2b2350', INK_SOFT = '#5d5480', INK_FAINT = '#a49cc4';
var CONF_MAX = 160;                    // 同屏纸屑上限（多巴胺版 120→160，掉帧保护 spawnScale 不变）

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var wrap = document.getElementById('wrap');

function fit() {
  var w = Math.min(window.innerWidth, window.innerHeight * W / H, 480);
  var h = w * H / W;
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  var dpr = Math.min(window.devicePixelRatio || 1, 3);   // DPR 上限 3，Retina 不发虚
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fit);

/* ================= 存档 ================= */
var SAVE_KEY = 'paopao_meifannao_v1';
var save = { unlocked: 1, stars: {}, props: { needle: 1, shock: 1, slow: 1 },
  music: true, jinnangMax: 0, lastVisit: '', lastDaily: '', giftClaimed: false,
  endHist: { forms: [], lines: [], combos: [] }, shareRewards: {} };
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    var p = JSON.parse(raw);
    if (p && p.props) {
      for (var k in save) if (p[k] !== undefined) save[k] = p[k];
      save.props = p.props;
    }
  }
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ================= 音效（WebAudio 合成，无外部文件） ================= */
var AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
/* 当前音量系数：解压/晚安/呼吸模式走柔和档 */
function sfxVolFactor() {
  if (screen === 'relax' || screen === 'night' || playKind === 'relax' || playKind === 'night') return 0.5;
  if (screen === 'breath' || screen === 'breathcard') return 0.4;
  return 1;
}
function tone(freqA, freqB, dur, type, vol, delay) {
  var ac = audio(); if (!ac) return;
  var t0 = ac.currentTime + (delay || 0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freqA, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(freqB, 1), t0 + dur);
  g.gain.setValueAtTime((vol || 0.15) * sfxVolFactor(), t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
/* 五声音阶（C 大调宫调式 C D E G A，两组八度循环上行） */
var SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
var noteIdx = 0, lastNoteAt = -10;
function sfxNote() {
  if (elapsed - lastNoteAt > 1.2) noteIdx = 0;              // 断连 1.2 秒音阶重置
  var f = SCALE[Math.min(noteIdx, SCALE.length - 1)];
  noteIdx++;
  lastNoteAt = elapsed;
  tone(f, f * 1.005, 0.11, 'square', 0.075);        // 方波短包络：亮脆主音（音高仍走五声音阶）
  tone(f * 2, f * 2, 0.07, 'triangle', 0.10);        // 高八度亮色
  tone(f * 0.5, f * 0.5, 0.05, 'square', 0.030);     // 低八度小打击垫
}
function sfxPopSoft() { tone(340, 240, 0.12, 'sine', 0.13); }   // 解压/晚安柔和戳声
function sfxCrack() { tone(210, 120, 0.06, 'square', 0.10); }
function sfxBlast() {  // 清空爆炸：上行小琶音
  [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, f, 0.11, 'square', 0.075, i * 0.04); });
  tone(170, 60, 0.22, 'sine', 0.16);
}
function sfxShatter() { tone(1350, 280, 0.22, 'sine', 0.14); tone(1800, 500, 0.16, 'sine', 0.07, 0.03); }
function sfxRed() { tone(880, 880, 0.08, 'square', 0.06); }
function sfxWhistle() { tone(620, 1860, 0.22, 'sine', 0.14); tone(1860, 1240, 0.12, 'sine', 0.07, 0.2); }  // 彩虹泡滑音哨
function sfxSpring() { tone(280, 920, 0.13, 'sine', 0.15); tone(920, 460, 0.11, 'sine', 0.10, 0.11); }       // 金色泡弹簧音
function sfxSparkle() { [1318.5, 1568, 2093].forEach(function (f, i) { tone(f, f, 0.09, 'sine', 0.06, i * 0.05); }); }
function sfxCheer() { [523.25, 587.33, 783.99].forEach(function (f, i) { tone(f, f, 0.1, 'square', 0.065, i * 0.05); }); }
function sfxWin() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone(f, f, 0.15, 'square', 0.08, i * 0.085); }); sfxSparkle(); }
function sfxSoftFail() { tone(392, 392, 0.14, 'sine', 0.10); tone(523.25, 523.25, 0.2, 'sine', 0.10, 0.13); }  // 温柔收尾，不丧气
function sfxClick() { tone(660, 660, 0.05, 'sine', 0.07); }
function sfxProp() { tone(587.33, 587.33, 0.07, 'triangle', 0.10); tone(880, 880, 0.1, 'triangle', 0.10, 0.06); }

/* ================= 多巴胺 BGM（WebAudio 合成循环，约 124 BPM，旋律更跳跃明亮） ================= */
var BGM = { started: false, step: 0, nextT: 0 };
var BGM_MELODY = [0, 4, 5, 4, 7, 5, 4, 2, 0, 4, 5, 7, 5, 4, 2, 1,   // 音阶序号，-1 休止（C 大调五声；多巴胺版跳进更多、休止更少）
                  2, 4, 7, 4, 5, 4, 2, 1, 0, 2, 4, -1, 5, 4, 2, -1];
var BGM_CHORDS = [[130.81, 196.00, 261.63], [98.00, 146.83, 196.00], [110.00, 164.81, 220.00], [87.31, 130.81, 174.61]]; // C G Am F 低音+和弦
var BGM_SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
function bgmVolFactor() {
  if (screen === 'relax' || screen === 'night' || screen === 'breath' || playKind === 'relax' || playKind === 'night') return 0.45;
  return 1;
}
function bgmNote(freq, t0, dur, type, vol) {
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol * bgmVolFactor(), t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function bgmTick() {
  if (!save.music || !BGM.started) return;
  var ac = audio(); if (!ac) return;
  var stepDur = 60 / 124 / 2;                       // 八分音符（124 BPM）
  if (BGM.nextT < ac.currentTime) { BGM.nextT = ac.currentTime + 0.05; BGM.step = 0; }
  while (BGM.nextT < ac.currentTime + 0.18) {
    var s = BGM.step, t0 = BGM.nextT;
    var bar = Math.floor(s / 8) % 4, chord = BGM_CHORDS[bar];
    if (s % 8 === 0) chord.forEach(function (f) { bgmNote(f * 2, t0, stepDur * 7, 'triangle', 0.022); });  // 和弦垫
    if (s % 4 === 0) bgmNote(chord[0], t0, stepDur * 2, 'sine', 0.05);                                      // 低音
    if (s % 2 === 1) bgmNote(6300, t0, 0.03, 'square', 0.006);                                              // 反拍小镲（律动；音量走 bgmVolFactor，安静模式自动变轻）
    var m = BGM_MELODY[s % BGM_MELODY.length];
    if (m >= 0) bgmNote(BGM_SCALE[m], t0, stepDur * 0.95, 'triangle', 0.05);                                // 主旋律
    BGM.step++; BGM.nextT += stepDur;
  }
}

/* ================= 工具 ================= */
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
/* 弹性缓动：鼓励字/面板/按钮统一 easeOutBack（多巴胺版过冲 1.70→2.1、回弹更脆），禁线性生硬进出 */
function easeOutBack(t) { var c1 = 2.1, c3 = c1 + 1; t = Math.max(0, Math.min(1, t)); return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeOut(t) { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }
/* 洗牌袋轮换：抽完一轮才重复 */

function buildQueue(level) {

  var ci = Math.floor(Math.random() * C), guard = 0;
  while (colorSeq.length < n && guard++ < 10000) {
    if (pool[ci] <= 0) { ci = (ci + 1) % C; continue; }
    var take = Math.min(pool[ci], level.run[0] + Math.floor(Math.random() * (level.run[1] - level.run[0] + 1)));
    for (var k = 0; k < take; k++) colorSeq.push(ci);
    pool[ci] -= take;
    ci = (ci + 1 + Math.floor(Math.random() * (C - 1))) % C;
  }
  return types.map(function (t, i) { return { type: t, color: colorSeq[i] }; });
}

function makeShareCard(item) {
  var c = document.createElement('canvas');
  c.width = 750; c.height = 1000;
  var g = c.getContext('2d');
  var grad = g.createLinearGradient(0, 0, 750, 1000);
  grad.addColorStop(0, '#ff4d94'); grad.addColorStop(0.5, '#ff8a5c'); grad.addColorStop(1, '#ffd93d');
  g.fillStyle = grad; g.fillRect(0, 0, 750, 1000);
  var decoCols = ['#ff3d8a', '#00a8ff', '#ffb300', '#84e01e', '#a259ff'];
  for (var i = 0; i < 7; i++) {
    g.beginPath(); g.arc(70 + (i * 173) % 680, 90 + (i * 211) % 760, 26 + (i % 3) * 12, 0, Math.PI * 2);
    g.fillStyle = decoCols[i % 5] + '55'; g.fill();
  }
  g.fillStyle = JINNANG_CAT_COLOR[item.cat];
  g.beginPath(); g.arc(375, 168, 40, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = 'bold 34px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(item.cat.slice(0, 1), 375, 170);
  g.fillStyle = '#2b2350'; g.font = 'bold 57px "PingFang SC","Microsoft YaHei",sans-serif';
  var words = item.text, line = '', ly = 330;
  for (var j = 0; j < words.length; j++) {
    if (g.measureText(line + words[j]).width > 600 && line) { g.fillText(line, 375, ly); ly += 84; line = ''; }
    line += words[j];
  }
  if (line) g.fillText(line, 375, ly);
  g.fillStyle = '#5d5480'; g.font = '30px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('—— ' + item.scene, 375, ly + 96);
  g.fillStyle = '#2b2350'; g.font = 'bold 29px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('泡泡没烦恼 · 好听话锦囊', 375, 884);
  g.fillStyle = '#a49cc4'; g.font = '25px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('dreamforgestudio.xyz/paopao2.html', 375, 928);
  var url = c.toDataURL('image/png');
  // 网页版：图片弹层呈现 + 保存图片下载（微信版此处换 wx 分享回调）
  try {
    var ov = document.getElementById('shareOverlay');
    if (!ov) {
      ov = document.createElement('div'); ov.id = 'shareOverlay';
      ov.innerHTML = '<img alt="分享卡"><div class="row"><a download="好听话锦囊.png">保存图片</a><button type="button">关闭</button></div>';
      document.body.appendChild(ov);
      ov.querySelector('button').addEventListener('click', function () { ov.style.display = 'none'; });
    }
    ov.querySelector('img').src = url;
    ov.querySelector('a').href = url;
    ov.style.display = 'flex';
  } catch (e) {}
  // 分享得奖：同一条锦囊每天首次生成，给送出方 1 个随机道具
  var today = dateStr(new Date());
  var idx = JINNANG.indexOf(item);

  return url;
}

  else if (screen === 'nightcard') drawNightCard();
  else if (screen === 'ending') drawEnding();
  else if (screen === 'clear') drawClear();
  else if (screen === 'fail') drawFail();
  ctx.restore();
  if (adOverlay) {
    ctx.fillStyle = 'rgba(20,28,48,0.88)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('模拟广告播放中…', W / 2, H / 2 - 14);
    ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.fillStyle = '#bcd3ea';
    ctx.fillText('这里将来是激励视频广告位', W / 2, H / 2 + 18);
  }
  if (toast && performance.now() / 1000 < toast.until) {
    ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
    var tw = ctx.measureText(toast.text).width + 28;
    ctx.fillStyle = 'rgba(43,35,80,0.92)';
    rr((W - tw) / 2, H - BAR_H - 40, tw, 32, 16); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(toast.text, W / 2, H - BAR_H - 23);
  }
}

/* ================= 输入 ================= */
function toLogic(e) {
  var rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * W / rect.width, y: (e.clientY - rect.top) * H / rect.height };
}
function hitButtons(p) {
  for (var i = buttons.length - 1; i >= 0; i--) {
    var b = buttons[i];
    if (!b.disabled && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      pressMark = { x: b.x, y: b.y, w: b.w, h: b.h, t: performance.now() / 1000 };
      b.act(); return true;
    }
  }
  return false;
}
function topBubbleAt(p) {
  for (var i = bubbles.length - 1; i >= 0; i--) {
    var b = bubbles[i];
    if (b.dead) continue;
    var dx = b.x - p.x, dy = b.y - p.y;
    if (dx * dx + dy * dy <= b.r * b.r) return b;
  }
  return null;
}
var jinDrag = null;
function popModeBubble(b) {
  b.dead = true;
  var col = b.joyColor || '#ffc2d6';
  addParticles(b.x, b.y, col, 7, 80);
  addRing(b.x, b.y, col, 34);
  addLaugh(b.x, b.y, 0.8);
  sfxPopSoft();
  if (playKind === 'relax') {
    relaxPops++;
    if (Math.random() < 0.22) addFloater(b.x, b.y - b.r - 4, bagDraw('comfort', WARM.comfort), '#4d9e8f', { size: 13.5, life: 1.4, fade: true });
  } else {
    nightPops++;
    if (nightPops >= 40) {
      nightLine = pick(WARM.night);
      sfxCheer();
      screen = 'nightcard';
    }
  }
  bubbles = bubbles.filter(function (x) { return !x.dead; });
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  audio();
  if (adOverlay) return;
  var p = toLogic(e);
  lastPointer = { x: p.x, y: p.y, t: performance.now() / 1000 };
  if (screen === 'home' && dailyCard) { dailyCard = null; return; }
  if (screen === 'ending') { enterClear(); return; }
  if (screen === 'jinnang') {
    if (hitButtons(p)) return;
    jinDrag = { startY: p.y, startScroll: jinnangScroll, moved: 0 };
    return;
  }
  if (screen === 'intro') { if (!hitButtons(p)) { startLevel(pendingLevel - 1); sfxClick(); } return; }
  if (screen === 'levels') { if (!hitButtons(p)) screen = 'home'; return; }
  if (screen === 'breath') {
    if (hitButtons(p)) return;
    if (breath) breath.holding = true;
    return;
  }
  if (screen !== 'play' && screen !== 'relax' && screen !== 'night') { hitButtons(p); return; }
  if (screen === 'relax' || screen === 'night') {
    if (hitButtons(p)) return;
    var mb = topBubbleAt(p);
    if (mb) popModeBubble(mb);
    return;
  }
  // play
  if (p.y >= H - BAR_H) { hitButtons(p); return; }
  if (mode === 'needle') {
    var tb = topBubbleAt(p);
    if (tb && tb.type === 'tough') {
      save.props.needle--; persist();
      tb.hp = 1; damageTough(tb, false);
      addFloater(tb.x, tb.y - tb.r, '一针爽，破了！', '#a86a24');
    } else showToast('一针爽只能用在顽固泡泡上');
    mode = null;
    return;
  }
  if (mode === 'shock') {
    save.props.shock--; persist();
    mode = null;
    sfxBlast();
    bubbles.slice().forEach(function (b) {
      if (b.dead || isSurprise(b)) return;
      var dx = b.x - p.x, dy = b.y - p.y;
      if (Math.sqrt(dx * dx + dy * dy) > 90 + b.r) return;
      if (b.type === 'normal' || b.type === 'red') { b.dead = true; pops++; addParticles(b.x, b.y, b.type === 'red' ? CORAL : JOY_COLORS[b.color], 8, 110); }
      else if (b.type === 'tough') damageTough(b, true);
    });
    addFloater(p.x, p.y, '抖一抖，碎一片！', '#8b3dff');
    bubbles = bubbles.filter(function (b) { return !b.dead; });
    return;
  }
  var b = topBubbleAt(p);
  if (b && b.type !== 'frozen') {
    if (b.type === 'tough') damageTough(b, false);
    else popBubble(b);
    bubbles = bubbles.filter(function (x) { return !x.dead; });
    return;
  }
  charge = { x: p.x, y: p.y, start: performance.now() / 1000, onIce: !!(b && b.type === 'frozen') };
  if (b && b.type === 'frozen' && !hintFlags.ice) {
    hintFlags.ice = true;
    addFloater(p.x, p.y - 40, '冻住了！按住蓄力', '#0091ff');
  }
});
cv.addEventListener('pointermove', function (e) {
  var p = toLogic(e);
  lastPointer = { x: p.x, y: p.y, t: performance.now() / 1000 };
  if (screen === 'jinnang' && jinDrag) {
    var dy = p.y - jinDrag.startY;
    jinDrag.moved = Math.max(jinDrag.moved, Math.abs(dy));
    var maxScroll = Math.max(0, JINNANG.length * 71 - (H - 110));
    jinnangScroll = Math.max(0, Math.min(maxScroll, jinDrag.startScroll - dy));
  }
});
function endCharge() {
  if (!charge) return;
  var held = performance.now() / 1000 - charge.start;
  var wasIce = charge.onIce;
  charge = null;
  if (held >= 0.6) shatterIce();
  else if (wasIce) addFloater(W / 2, FIELD_Y + 60, '按住 0.6 秒蓄力再松手', '#0091ff');
}
cv.addEventListener('pointerup', function (e) {
  if (screen === 'play') endCharge();
  if (screen === 'breath' && breath) breath.holding = false;
  if (screen === 'jinnang' && jinDrag) {
    var wasTap = jinDrag.moved < 8;
    jinDrag = null;
    if (wasTap) {
      var p = toLogic(e);
      for (var i = 0; i < jinnangHits.length; i++) {
        var h = jinnangHits[i];
        if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) {
          if (h.open) { jinnangSel = h.idx; screen = 'jindetail'; sfxClick(); }
          else showToast('过关就能解锁这条啦');
          break;
        }
      }
    }
  }
});
cv.addEventListener('pointercancel', function () { charge = null; jinDrag = null; if (breath) breath.holding = false; });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ================= 每日第一句 / 回归想念 / gift 欢迎道具 ================= */
function dateStr(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dayNum(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
var nightLine = '';
(function bootDaily() {
  var now = new Date(), today = dateStr(now);
  var daysAway = 0;
  if (save.lastVisit) daysAway = dayNum(now) - dayNum(new Date(save.lastVisit));
  if (save.lastVisit && daysAway >= 1) todayLine = WARM.miss[dayNum(now) % WARM.miss.length];
  else todayLine = WARM.daily[dayNum(now) % WARM.daily.length];
  if (save.lastDaily !== today) {
    var gp = pick(['needle', 'shock', 'slow']);
    save.props[gp] = Math.min(9, (save.props[gp] || 0) + 1);
    var tomorrowLine = WARM.daily[(dayNum(now) + 1) % WARM.daily.length];
    dailyCard = { line: todayLine, propName: PROP_NAMES[gp], tomorrow: tomorrowLine.slice(0, 2) };
    save.lastDaily = today;
  }
  save.lastVisit = today;
  try {
    if (typeof location !== 'undefined' && /[?&]gift=1/.test(location.search || '') && !save.giftClaimed) {
      save.giftClaimed = true;
      var wp = pick(['needle', 'shock', 'slow']);
      save.props[wp] = Math.min(9, (save.props[wp] || 0) + 1);
      setTimeout(function () { showToast('欢迎礼：' + PROP_NAMES[wp] + ' +1，开心收下'); }, 400);
    }
  } catch (e) {}
  persist();
})();

/* ================= 主循环 ================= */
var lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  spawnScale = dt > 0.034 ? 0.5 : 1;      // 掉帧先减粒子，不减判定
  animT += dt;
  bgmTick();
  if (adOverlay && now / 1000 >= adOverlay.until) {
    var cb = adOverlay.cb; adOverlay = null;
    if (cb) cb();
  }
  if (!adOverlay) {
    if (screen === 'play') update(dt);
    else if (screen === 'relax' || screen === 'night') updateMode(dt);
    else if (screen === 'breath') breathUpdate(dt);
    else if (screen === 'ending') {
      endingT += dt;
      updateFx(dt);
      if (endingT >= 2.5) enterClear();
    } else if (screen === 'clear') updateFx(dt);
    else if (screen === 'home') {
      homeConfTick -= dt;
      if (homeConfTick <= 0 && homeConfetti.length < 18) {
        homeConfTick = 0.45;
        homeConfetti.push({ x: rnd(30, W - 30), y: 206, vx: rnd(-8, 8), vy: rnd(9, 18), w: rnd(4, 6), h: rnd(6, 10), rot: rnd(0, 6), vr: rnd(-3, 3), color: pick(CONF_COLORS), t: 0, life: rnd(2, 3) });
      }
      homeConfetti = homeConfetti.filter(function (c) { c.t += dt; c.x += c.vx * dt + Math.sin(animT * 2 + c.rot) * 0.4; c.y += c.vy * dt; c.rot += c.vr * dt; return c.t < c.life && c.y < 252; });
    }
  }
  draw();
}
buildSprites();
fit();
requestAnimationFrame(frame);
</script>
