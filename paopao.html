/* 每关使用的颜色种数：需要清空爆炸的关卡颜色少、单色总量足，
 * 机器人/玩家才能连戳同色攒满 8 连击。 */
var COLOR_COUNT = { 1: 4, 2: 3, 3: 4, 4: 5, 5: 4, 6: 3, 7: 4, 8: 4, 9: 5, 10: 4, 11: 4, 12: 4, 13: 5, 14: 5, 15: 4 };
LEVELS.forEach(function (l) { l.colors = COLOR_COUNT[l.id] || 4; });

/* 达标门槛（按难度层）：机器人基线判定用 */

if (typeof module !== 'undefined' && module.exports) {

<script>
'use strict';
/* ================= 常量（与 sim.js 同步，参数同源 levels.js） ================= */
var W = 375, H = 667, HUD_H = 64, BAR_H = 76, FIELD_Y = 64, FIELD_H = 527;
var BLAST_NEED = 8, BLAST_RADIUS = 115, CRACK_RANGE = 26, RED_TTL = 5, SCREEN_TARGET = 12;
var COLORS = COLOR_VALUES;

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var wrap = document.getElementById('wrap');

function fit() {
  var w = Math.min(window.innerWidth, window.innerHeight * W / H, 480);
  var h = w * H / W;
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fit);

/* ================= 存档 ================= */
var SAVE_KEY = 'paopao_meifannao_v1';
var save = { unlocked: 1, stars: {}, props: { needle: 1, shock: 1, slow: 1 } };
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw) { var p = JSON.parse(raw); if (p && p.props) save = p; }
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ================= 音效（WebAudio 合成，无外部文件） ================= */
var AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freqA, freqB, dur, type, vol, delay) {
  var ac = audio(); if (!ac) return;
  var t0 = ac.currentTime + (delay || 0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freqA, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(freqB, 1), t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfxPop(streak) { tone(480 + streak * 45 + Math.random() * 60, 180, 0.09, 'triangle', 0.20); }
function sfxCrack() { tone(210, 120, 0.06, 'square', 0.10); }
function sfxBlast() { tone(170, 38, 0.38, 'sine', 0.32); tone(900, 200, 0.18, 'triangle', 0.10); }
function sfxShatter() { tone(1350, 280, 0.22, 'sine', 0.16); tone(1800, 500, 0.16, 'sine', 0.08, 0.03); }
function sfxRed() { tone(880, 880, 0.08, 'square', 0.07); }
function sfxWin() { tone(523, 523, 0.12, 'triangle', 0.16); tone(659, 659, 0.12, 'triangle', 0.16, 0.11); tone(784, 784, 0.22, 'triangle', 0.18, 0.22); }
function sfxFail() { tone(392, 392, 0.14, 'triangle', 0.14); tone(330, 330, 0.14, 'triangle', 0.14, 0.13); tone(262, 200, 0.26, 'triangle', 0.14, 0.26); }
function sfxClick() { tone(660, 660, 0.05, 'sine', 0.08); }

/* ================= 工具 ================= */
function rnd(a, b) { return a + Math.random() * (b - a); }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 与 sim.js 相同的队列生成：类型按 mix 洗牌，颜色按 run 成组、总量均衡 */
function buildQueue(level) {
  var types = [];
  ['normal', 'tough', 'frozen'].forEach(function (t) {
    for (var i = 0; i < (level.mix[t] || 0); i++) types.push(t);
  });
  types = shuffle(types);
  var n = types.length, C = level.colors, pool = [], colorSeq = [];
  for (var c = 0; c < C; c++) pool.push(Math.floor(n / C) + (c < (n % C) ? 1 : 0));
  var ci = Math.floor(Math.random() * C), guard = 0;
  while (colorSeq.length < n && guard++ < 10000) {
    if (pool[ci] <= 0) { ci = (ci + 1) % C; continue; }
    var take = Math.min(pool[ci], level.run[0] + Math.floor(Math.random() * (level.run[1] - level.run[0] + 1)));
    for (var k = 0; k < take; k++) colorSeq.push(ci);
    pool[ci] -= take;
    ci = (ci + 1 + Math.floor(Math.random() * (C - 1))) % C;
  }
  return types.map(function (t, i) { return { type: t, color: colorSeq[i] }; });
}

/* ================= 游戏状态 ================= */
var screen = 'home';           // home / intro / play / clear / fail
var cur = null;                // 当前关卡配置
var bubbles = [], particles = [], floaters = [];
var queue = [], spawned = 0, redSpawned = 0;
var pops = 0, blasts = 0, redMissed = 0, lives = 3;
var elapsed = 0, timeLeft = 0, slowUntil = -1;
var streakColor = -1, streak = 0, lastPopAt = -10;
var wordPool = [], wordIdx = 0;
var mode = null;               // 'needle' / 'shock' 道具待选目标
var revives = 0;
var failReason = '', clearInfo = null;
var charge = null;             // {x,y,start}
var adOverlay = null;          // {until, cb} 模拟广告
var toast = null;              // {text, until}
var hintFlags = {};
var spawnTick = 0;
var buttons = [];              // 当前屏按钮 {x,y,w,h,label,act,style,badge}

function nextWord() {
  if (wordIdx >= wordPool.length) { wordPool = shuffle(WORDS); wordIdx = 0; }
  return wordPool[wordIdx++];
}
function radiusOf(level, type) {
  if (type === 'tough') return level.radius + 3;
  if (type === 'frozen') return level.radius + 1;
  return level.radius + rnd(-3, 3);
}
function spawnBubble(spec) {
  var r = radiusOf(cur, spec.type);
  var x = rnd(r + 4, W - r - 4), y = FIELD_Y + rnd(r + 4, FIELD_H - r - 4);
  for (var tries = 0; tries < 8; tries++) {
    var ok = true;
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i], dx = b.x - x, dy = b.y - y;
      if (dx * dx + dy * dy < (b.r + r) * (b.r + r) * 0.55) { ok = false; break; }
    }
    if (ok) break;
    x = rnd(r + 4, W - r - 4); y = FIELD_Y + rnd(r + 4, FIELD_H - r - 4);
  }
  var ang = rnd(0, Math.PI * 2), spd = spec.type === 'frozen' ? 0 : rnd(10, 24) * cur.speed;
  bubbles.push({
    type: spec.type, color: spec.color, x: x, y: y, r: r,
    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    hp: spec.type === 'tough' ? 2 : 1,
    ttl: spec.type === 'red' ? RED_TTL : Infinity,
    word: nextWord(), seed: rnd(0, 10), dead: false
  });
}
function startLevel(idx) {
  cur = LEVELS[idx];
  bubbles = []; particles = []; floaters = [];
  queue = buildQueue(cur); spawned = 0; redSpawned = 0;
  pops = 0; blasts = 0; redMissed = 0; lives = 3;
  elapsed = 0; timeLeft = cur.timeLimit || 0; slowUntil = -1;
  streakColor = -1; streak = 0; lastPopAt = -10;
  mode = null; revives = 0; charge = null; spawnTick = 0;
  hintFlags = {};
  if (cur.mode !== 'timed') {
    while (spawned < queue.length) spawnBubble(queue[spawned++]);
  }
  screen = 'play';
}
function addParticles(x, y, color, n, power) {
  for (var i = 0; i < (n || 12); i++) {
    var a = rnd(0, Math.PI * 2), s = rnd(30, power || 130);
    particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: rnd(0.35, 0.7), t: 0, color: color, r: rnd(2, 4.5) });
  }
}
function addFloater(x, y, text, color) {
  floaters.push({ x: x, y: y, text: text, color: color || '#1d2b53', t: 0, life: 1.1 });
}
function showToast(text) { toast = { text: text, until: performance.now() / 1000 + 1.6 }; }

/* ================= 规则（与 sim.js 一致） ================= */
function crackToughsNear(x, y, r) {
  bubbles.forEach(function (b) {
    if (b.type === 'tough' && !b.dead) {
      var dx = b.x - x, dy = b.y - y;
      if (Math.sqrt(dx * dx + dy * dy) < r + b.r + CRACK_RANGE) damageTough(b, true);
    }
  });
}
function damageTough(b, byWave) {
  if (b.dead) return;
  b.hp--;
  if (b.hp <= 0) {
    b.dead = true; pops++;
    addParticles(b.x, b.y, '#b08968', 14, 150);
    addFloater(b.x, b.y - b.r, '壳碎了！', '#7f5539');
    sfxBlast();
  } else {
    if (!byWave) sfxCrack();
    addFloater(b.x, b.y - b.r, '裂了一道！', '#7f5539');
    addParticles(b.x, b.y, '#d6ccc2', 5, 80);
  }
}
function doBlast(x, y) {
  blasts++;
  sfxBlast();
  addFloater(x, y - 20, '烦恼清空！', '#e63946');
  bubbles.forEach(function (b) {
    if (b.dead) return;
    var dx = b.x - x, dy = b.y - y;
    if (Math.sqrt(dx * dx + dy * dy) > BLAST_RADIUS + b.r) return;
    if (b.type === 'normal' || b.type === 'red') {
      b.dead = true; pops++;
      addParticles(b.x, b.y, b.type === 'red' ? '#ef476f' : COLORS[b.color], 8, 110);
    } else if (b.type === 'tough') damageTough(b, true);
  });
}
function popBubble(b) {
  if (b.dead) return;
  b.dead = true; pops++;
  addParticles(b.x, b.y, b.type === 'red' ? '#ef476f' : COLORS[b.color], 13, 140);
  if (b.type === 'normal') {
    crackToughsNear(b.x, b.y, b.r);
    if (b.color === streakColor && elapsed - lastPopAt <= 1.5) streak++;
    else { streakColor = b.color; streak = 1; }
    lastPopAt = elapsed;
    sfxPop(streak);
    if (streak >= 3) addFloater(b.x, b.y - b.r - 4, '连击 ×' + streak, '#5a189a');
    if (streak >= BLAST_NEED) { doBlast(b.x, b.y); streak = 0; streakColor = -1; }
  } else {
    sfxPop(2);
  }
}
function shatterIce() {
  var n = 0;
  bubbles.forEach(function (b) {
    if (b.type === 'frozen' && !b.dead) { b.dead = true; pops++; n++; addParticles(b.x, b.y, '#a9d6e5', 12, 130); }
  });
  if (n > 0) { sfxShatter(); addFloater(W / 2, FIELD_Y + 70, '冰面震碎！', '#0077b6'); }
}
function grantProp(type, why) {

  }
  if (cur.id < 15) {
    drawBtn(72, by, 232, 48, '下一关', function () { pendingLevel = cur.id + 1; screen = 'intro'; sfxClick(); }, { fill: '#e63946', font: 18 });
    by += 58;
  } else {
    ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.fillStyle = '#e63946';
    ctx.fillText('全部通关，烦恼清零！', W / 2, by + 20); by += 48;
  }
  drawBtn(72, by, 110, 42, '重玩本关', function () { pendingLevel = cur.id; screen = 'intro'; sfxClick(); }, { fill: '#9db2ce', font: 14 });
  drawBtn(194, by, 110, 42, '回到首页', function () { screen = 'home'; sfxClick(); }, { fill: '#9db2ce', font: 14 });
  // 模拟 Banner 广告位（仅结算页）
  ctx.fillStyle = '#d9d9d9'; ctx.fillRect(0, H - 44, W, 44);
  ctx.fillStyle = '#8a8a8a'; ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('广告位', W / 2, H - 22);
}
function drawFail() {
  bgGrad();
  panel(28, 130, W - 56, 380);
  ctx.fillStyle = '#1d2b53'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('失败啦', W / 2, 178);
  drawWrapped(failReason, 56, 214, W - 112, 26, '16px "PingFang SC","Microsoft YaHei",sans-serif', '#e63946', 'center');
  ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.fillStyle = '#5a6b85';
  ctx.fillText('已破 ' + pops + ' 个 · 用时 ' + Math.round(elapsed) + ' 秒', W / 2, 268);
  if (revives < 2) {
    drawBtn(72, 300, 232, 52, '看视频复活', function () { revive(); }, { fill: '#e63946', font: 18, badge: '模拟广告位' });
  } else {
    ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.fillStyle = '#93a5bd';
    ctx.fillText('本局复活次数已用完', W / 2, 326);
  }
  drawBtn(72, 368, 232, 48, '重新开始', function () { startLevel(cur.id - 1); sfxClick(); }, { fill: '#5a189a', font: 17 });
  drawBtn(72, 428, 232, 44, '回到首页', function () { screen = 'home'; sfxClick(); }, { fill: '#9db2ce', font: 15 });
}
function draw() {
  buttons = [];
  if (screen === 'home') drawHome();
  else if (screen === 'intro') drawIntro();
  else if (screen === 'play') drawPlay();
  else if (screen === 'clear') drawClear();
  else if (screen === 'fail') drawFail();
  if (adOverlay) {
    ctx.fillStyle = 'rgba(20,28,48,0.88)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('模拟广告播放中…', W / 2, H / 2 - 14);
    ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.fillStyle = '#bcd3ea';
    ctx.fillText('这里将来是激励视频广告位', W / 2, H / 2 + 18);
  }
  if (toast && performance.now() / 1000 < toast.until) {
    ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
    var tw = ctx.measureText(toast.text).width + 28;
    ctx.fillStyle = 'rgba(29,43,83,0.92)';
    rr((W - tw) / 2, H - BAR_H - 46, tw, 32, 16); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(toast.text, W / 2, H - BAR_H - 29);
  }
}

/* ================= 输入 ================= */
function toLogic(e) {
  var rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * W / rect.width, y: (e.clientY - rect.top) * H / rect.height };
}
function hitButtons(p) {
  for (var i = buttons.length - 1; i >= 0; i--) {
    var b = buttons[i];
    if (!b.disabled && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.act(); return true; }
  }
  return false;
}
function topBubbleAt(p) {
  for (var i = bubbles.length - 1; i >= 0; i--) {
    var b = bubbles[i];
    if (b.dead) continue;
    var dx = b.x - p.x, dy = b.y - p.y;
    if (dx * dx + dy * dy <= b.r * b.r) return b;
  }
  return null;
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  audio();
  if (adOverlay) return;
  var p = toLogic(e);
  if (screen !== 'play') { hitButtons(p); return; }
  if (p.y >= H - BAR_H) { hitButtons(p); return; }
  if (mode === 'needle') {
    var tb = topBubbleAt(p);
    if (tb && tb.type === 'tough') {
      save.props.needle--; persist();
      tb.hp = 1; damageTough(tb, false);
      addFloater(tb.x, tb.y - tb.r, '针戳破了！', '#7f5539');
    } else showToast('针只能用在顽固泡泡上');
    mode = null;
    return;
  }
  if (mode === 'shock') {
    save.props.shock--; persist();
    mode = null;
    sfxBlast();
    bubbles.slice().forEach(function (b) {
      if (b.dead) return;
      var dx = b.x - p.x, dy = b.y - p.y;
      if (Math.sqrt(dx * dx + dy * dy) > 90 + b.r) return;
      if (b.type === 'normal' || b.type === 'red') { b.dead = true; pops++; addParticles(b.x, b.y, b.type === 'red' ? '#ef476f' : COLORS[b.color], 9, 120); }
      else if (b.type === 'tough') damageTough(b, true);
    });
    addFloater(p.x, p.y, '震碎一片！', '#5a189a');
    bubbles = bubbles.filter(function (b) { return !b.dead; });
    return;
  }
  var b = topBubbleAt(p);
  if (b && b.type !== 'frozen') {
    if (b.type === 'tough') damageTough(b, false);
    else popBubble(b);
    bubbles = bubbles.filter(function (x) { return !x.dead; });
    return;
  }
  // 冰冻泡或空地：开始蓄力
  charge = { x: p.x, y: p.y, start: performance.now() / 1000, onIce: !!(b && b.type === 'frozen') };
  if (b && b.type === 'frozen' && !hintFlags.ice) {
    hintFlags.ice = true;
    addFloater(p.x, p.y - 40, '冻住了！按住蓄力', '#0077b6');
  }
});
function endCharge() {
  if (!charge) return;
  var held = performance.now() / 1000 - charge.start;
  var wasIce = charge.onIce;
  charge = null;
  if (held >= 0.6) shatterIce();
  else if (wasIce) addFloater(W / 2, FIELD_Y + 60, '按住 0.6 秒蓄力再松手', '#0077b6');
}
cv.addEventListener('pointerup', function (e) { e.preventDefault(); if (screen === 'play') endCharge(); });
cv.addEventListener('pointercancel', function () { charge = null; });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ================= 主循环 ================= */
var lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (adOverlay && now / 1000 >= adOverlay.until) {
    var cb = adOverlay.cb; adOverlay = null;
    if (cb) cb();
  }
  if (screen === 'play' && !adOverlay) update(dt);
  draw();
}
fit();
requestAnimationFrame(frame);
</script>
</body>
